spring.application.name=scalelab

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/scalelab
spring.datasource.username=postgres
spring.datasource.password=Passw@rd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Pagination defaults
app.pagination.default-page=0
app.pagination.default-size=20
app.pagination.max-size=100

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Cache TTL = 60 seconds (short for trading data)
app.cache.ttl-seconds=60

# HikariCP Connection Pool
# Phase 4: increased from 10 ? 20 to handle async worker threads + request threads
# Async workers (up to 16) + Tomcat threads need connections concurrently
spring.datasource.hikari.maximum-pool-size=20
# connection timeout = 5 seconds (default is 30s ? lowered to trigger exhaustion errors faster)
spring.datasource.hikari.connection-timeout=5000
# leak detection = 2 seconds (logs warning if connection held longer than this)
spring.datasource.hikari.leak-detection-threshold=2000
# pool name for easy identification in logs
spring.datasource.hikari.pool-name=ScaleLabPool

# Phase 4 ? JPA Batch Insert Configuration
# Enables Hibernate to batch multiple INSERTs into a single JDBC call
# Works with OrderWriteBufferService.saveAll() to reduce DB round-trips
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Phase 4 ? Write Buffer Configuration
# flush interval (ms) ? how often the buffer flushes to DB
app.write-buffer.flush-interval-ms=100
# tracking TTL (minutes) ? how long tracking entries are kept in memory
app.write-buffer.tracking-ttl-minutes=5

# Logging
logging.level.io.scalelab=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

